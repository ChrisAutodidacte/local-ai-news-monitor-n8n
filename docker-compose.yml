# =============================================================================
#  Local AI News Monitor & Newsletter — Complete 100% Self-Hosted Stack
# =============================================================================
#  Start everything with a single command:
#      docker compose up -d
#
#  First copy .env.example to .env and configure your variables.
#  Full details in README.md and docs/installation.md.
# =============================================================================

name: local-ai-news-monitor

networks:
  monitor_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  ollama_data:

services:
  # --- Database: PostgreSQL (shared by n8n and the news monitor) --------------
  postgres:
    image: postgres:16-alpine
    container_name: monitor_postgres
    restart: unless-stopped
    networks: [monitor_network]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is automatically created upon first container startup:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Workflow Orchestrator: n8n ---------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: monitor_n8n
    restart: unless-stopped
    networks: [monitor_network]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_SECURE_COOKIE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME}
      DB_POSTGRESDB_USER: ${DB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Local AI Engine: Ollama (article summarization & categorization) --------
  ollama:
    image: ollama/ollama:latest
    container_name: monitor_ollama
    restart: unless-stopped
    networks: [monitor_network]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU acceleration: uncomment below if you have nvidia-container-toolkit installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --- Meta Search Engine: SearXNG (web scraping / search without API keys) ---
  searxng:
    image: searxng/searxng:latest
    container_name: monitor_searxng
    restart: unless-stopped
    networks: [monitor_network]
    ports:
      - "8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    depends_on:
      - searxng-redis

  searxng-redis:
    image: redis:7-alpine
    container_name: monitor_searxng_redis
    restart: unless-stopped
    networks: [monitor_network]
    command: redis-server --save 30 1 --loglevel warning

  # --- Administration Dashboard: Flask ----------------------------------------
  monitor_admin:
    build: ./admin
    container_name: monitor_admin
    restart: unless-stopped
    networks: [monitor_network]
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
