<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}News Monitor Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #e2b96f !important; }
    .nav-link { color: #ccc !important; }
    .nav-link:hover, .nav-link.active { color: #fff !important; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .badge-a_analyser  { background: #ffc107; color: #000; }
    .badge-analyse     { background: #198754; }
    .badge-erreur      { background: #dc3545; }
    .badge-email       { background: #0d6efd; }
    .badge-search      { background: #6f42c1; }
    .badge-web_scraping{ background: #0dcaf0; color:#000; }
    .table-hover tbody tr:hover { background: #eef2ff; cursor: pointer; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-radar"></i> News Monitor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/sources' in request.path %}active{% endif %}" href="/sources">
            <i class="bi bi-collection"></i> Sources
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/articles' in request.path %}active{% endif %}" href="/articles">
            <i class="bi bi-newspaper"></i> Articles
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/subscribers' in request.path or '/abonnes' in request.path %}active{% endif %}" href="/subscribers">
            <i class="bi bi-people"></i> Subscribers
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/themes' in request.path and '/suggestions' not in request.path %}active{% endif %}" href="/themes">
            <i class="bi bi-tags"></i> Topics
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/suggestions-themes' in request.path %}active{% endif %}" href="/suggestions-themes">
            <i class="bi bi-lightbulb"></i> Suggestions
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
